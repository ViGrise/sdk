[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "vigrise"
version = "0.1.0"
description = "ViGrise SDK: VGR4 request signing, ViGrise Accounts, ViGrise Storage and the Speech API"
license = "Apache-2.0"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
requests = ["requests>=2.28"]
httpx = ["httpx>=0.24"]
speech = ["httpx>=0.24"]
storage = ["httpx>=0.24"]
accounts = ["httpx>=0.24", "PyJWT[crypto]>=2.8"]
all = ["requests>=2.28", "httpx>=0.24", "PyJWT[crypto]>=2.8"]
test = ["pytest>=7", "pytest-asyncio>=0.23", "ruff>=0.6", "requests>=2.28", "httpx>=0.24", "PyJWT[crypto]>=2.8"]

[tool.hatch.build.targets.wheel]
packages = ["vigrise"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
indent-width = 2
line-length = 100
target-version = "py39"

[tool.ruff.format]
indent-style = "space"
