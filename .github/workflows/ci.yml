name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vectors:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Vectors are regenerated from inputs
        run: |
          python3 test-vectors/generate.py
          git diff --exit-code test-vectors/vgr4

  rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust/vigrise-auth
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --no-default-features -- -D warnings
      - run: cargo clippy --features reqwest -- -D warnings
      - run: cargo clippy --all-targets --features verify -- -D warnings
      - run: cargo test --features verify
