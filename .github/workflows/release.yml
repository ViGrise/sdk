name: release

# Publishes every package when a `v<version>` tag is pushed. Each registry
# authenticates the workflow through trusted publishing (OIDC) from the
# `release` environment, which runs only for `v*` tags and waits for a
# reviewer, so the repository holds no registry tokens.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.check.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The tagged commit is on main
        run: git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - id: check
        name: Every package carries the tag's version
        run: |
          version="${GITHUB_REF_NAME#v}"
          rust=$(sed -n 's/^version = "\(.*\)"/\1/p' rust/Cargo.toml | head -1)
          cli_dep=$(sed -n 's/^vigrise = .*version = "\([^"]*\)".*/\1/p' rust/vigrise-cli/Cargo.toml)
          sso_dep=$(sed -n 's/^vigrise = .*version = "\([^"]*\)".*/\1/p' rust/vigrise-sso/Cargo.toml)
          typescript=$(node -p 'require("./typescript/sdk/package.json").version')
          typescript_sso=$(node -p 'require("./typescript/sso/package.json").version')
          typescript_sso_dep=$(node -p 'require("./typescript/sso/package.json").peerDependencies["@vigrise/sdk"]')
          python=$(sed -n 's/^version = "\(.*\)"/\1/p' python/pyproject.toml | head -1)
          echo "tag $version, rust $rust, vigrise-cli dependency $cli_dep, vigrise-sso dependency $sso_dep, @vigrise/sdk $typescript, @vigrise/sso $typescript_sso (sdk range $typescript_sso_dep), python $python"
          test "$rust" = "$version"
          test "$cli_dep" = "$version"
          test "$sso_dep" = "$version"
          test "$typescript" = "$version"
          test "$typescript_sso" = "$version"
          test "$typescript_sso_dep" = "^$version"
          test "$python" = "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  crates:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: rust-lang/crates-io-auth-action@v1
        id: auth
      - name: Publish the crates that lack this version
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for crate in vigrise vigrise-sso vigrise-cli; do
            status=$(curl -s -o /dev/null -w '%{http_code}' -A 'ViGrise release (github.com/ViGrise/sdk)' \
              "https://crates.io/api/v1/crates/$crate/$VERSION")
            if [ "$status" = 200 ]; then
              echo "$crate $VERSION is already on crates.io"
            else
              cargo publish -p "$crate"
            fi
          done

  npm:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    defaults:
      run:
        working-directory: typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: npm with staged publishing support
        run: npm install -g "npm@>=11.15.0"
      - run: npm ci
      - run: npm run build
      - name: Stage the packages when npm lacks this version
        env:
          VERSION: ${{ needs.version.outputs.version }}
        shell: bash
        run: |
          set -o pipefail
          for package in sdk sso; do
            name=$(node -p "require('./$package/package.json').name")
            if npm view "$name@$VERSION" version >/dev/null 2>&1; then
              echo "$name $VERSION is already on npm"
            elif ! (cd "$package" && npm stage publish 2>&1 | tee "../stage-$package.log"); then
              # The registry answers 409 for a version it already holds before
              # `npm view` shows it.
              grep -q 'previously published version' "stage-$package.log"
              echo "$name $VERSION is already on npm"
            fi
          done

  pypi:
    needs: [ci, version]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install build
      - run: python -m build python --outdir dist
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true

  github-release:
    needs: [version, crates, npm, pypi]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: GitHub release with the registry links and the generated changelog
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes --notes "$(cat <<NOTES
          Packages:
          - crates.io: [vigrise $VERSION](https://crates.io/crates/vigrise/$VERSION), [vigrise-sso $VERSION](https://crates.io/crates/vigrise-sso/$VERSION), [vigrise-cli $VERSION](https://crates.io/crates/vigrise-cli/$VERSION)
          - npm: [@vigrise/sdk $VERSION](https://www.npmjs.com/package/@vigrise/sdk/v/$VERSION), [@vigrise/sso $VERSION](https://www.npmjs.com/package/@vigrise/sso/v/$VERSION) (public once a maintainer approves the staged packages)
          - PyPI: [vigrise $VERSION](https://pypi.org/project/vigrise/$VERSION/)
          NOTES
          )"
