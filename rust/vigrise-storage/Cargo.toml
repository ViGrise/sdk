[package]
name = "vigrise-storage"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Client for ViGrise Storage: buckets, objects, multipart uploads, presigned URLs and lifecycle rules"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vigrise-storage"
readme = "README.md"
keywords = ["vigrise", "storage", "object-storage", "s3", "client"]
categories = ["api-bindings", "asynchronous"]
include = ["src/**", "README.md", "LICENSE"]

[dependencies]
vigrise-auth = { path = "../vigrise-auth", version = "0.1.0", features = ["reqwest"] }
bytes = "1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
futures-util = "0.3"
http = "1"
percent-encoding = "2"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
