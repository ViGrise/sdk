[package]
name = "vigrise-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ViGrise command line: sign in with your ViGrise account and get role session credentials"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vigrise-cli"
readme = "README.md"
keywords = ["vigrise", "cli", "login", "credentials", "sso"]
categories = ["command-line-utilities", "authentication"]
include = ["src/**", "README.md", "LICENSE"]

[lib]
name = "vigrise_cli"
path = "src/lib.rs"

[[bin]]
name = "vigrise"
path = "src/main.rs"

[dependencies]
vigrise = { path = "../vigrise", version = "0.2.0" }
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
clap = { version = "4.5", features = ["derive", "env"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "rustls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util"] }
url = "2"

[dev-dependencies]
axum = { version = "0.8", features = ["tokio", "http1", "query", "form", "json"] }
tempfile = "3"

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
