[package]
name = "vigrise-accounts"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "ViGrise Accounts for Rust services: SSO introspection, back-channel logout verification and OAuth2/OIDC helpers"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vigrise-accounts"
readme = "README.md"
keywords = ["vigrise", "accounts", "sso", "oidc", "oauth2"]
categories = ["authentication", "api-bindings"]
include = ["src/**", "README.md", "LICENSE"]

[features]
default = []
axum = ["dep:axum"]
testing = ["dep:rsa", "dep:rand_core"]

[dependencies]
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
jsonwebtoken = { version = "10.3", default-features = false, features = ["rust_crypto", "use_pem"] }
rand = "0.9"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls", "form"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
thiserror = "2"
tracing = "0.1"
url = "2"

axum = { version = "0.8", optional = true, default-features = false, features = ["json"] }
rsa = { version = "0.9", optional = true, features = ["pem"] }
rand_core = { version = "0.6", optional = true, features = ["getrandom"] }

[dev-dependencies]
vigrise-accounts = { path = ".", features = ["testing"] }
axum = { version = "0.8", features = ["tokio", "http1", "json"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
