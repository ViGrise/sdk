[package]
name = "vigrise-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "VGR4 request signing and verification for ViGrise services"
repository.workspace = true
homepage.workspace = true
authors.workspace = true
documentation = "https://docs.rs/vigrise-auth"
readme = "README.md"
keywords = ["vigrise", "authentication", "signing", "sigv4", "iam"]
categories = ["authentication", "api-bindings"]
include = ["src/**", "examples/**", "README.md", "LICENSE"]

[features]
default = []
reqwest = ["dep:reqwest"]
sts = ["reqwest", "dep:tokio", "tokio/sync", "chrono/serde"]
verify = ["sts", "dep:axum", "dep:bytes", "dep:http-body", "dep:http-body-util", "dep:tokio", "tokio/rt", "dep:uuid", "dep:tracing"]
sigv4 = ["verify", "dep:base64", "dep:crc-fast", "dep:sha1"]
metering = ["verify", "tokio/sync", "tokio/rt", "tokio/macros", "uuid/v4", "chrono/serde"]
openapi = ["dep:utoipa"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
http = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
axum = { version = "0.8", optional = true, default-features = false, features = ["json", "original-uri", "tokio"] }
base64 = { version = "0.22", optional = true }
bytes = { version = "1", optional = true }
crc-fast = { version = "1", optional = true, default-features = false, features = ["std"] }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
sha1 = { version = "0.10", optional = true }
tokio = { version = "1", optional = true, features = ["time"] }
uuid = { version = "1", optional = true, features = ["serde"] }
tracing = { version = "0.1", optional = true }
utoipa = { version = "5.4", optional = true, features = ["chrono", "uuid"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.8", features = ["tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }

[package.metadata.docs.rs]
all-features = true
rustdoc-args = ["--cfg", "docsrs"]
