[package]
name = "vigrise-auth"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "VGR4 request signing and verification for ViGrise services"

[features]
default = []
reqwest = ["dep:reqwest"]
sts = ["reqwest", "dep:tokio", "tokio/sync", "chrono/serde"]
verify = ["sts", "dep:axum", "dep:bytes", "dep:http-body", "dep:http-body-util", "dep:tokio", "tokio/rt", "dep:uuid", "dep:tracing"]
metering = ["verify", "tokio/sync", "tokio/rt", "tokio/macros", "uuid/v4", "chrono/serde"]
openapi = ["dep:utoipa"]

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
hex = "0.4"
hmac = "0.12"
http = "1"
percent-encoding = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"

reqwest = { version = "0.13", optional = true, default-features = false, features = ["json", "rustls"] }
axum = { version = "0.8", optional = true, default-features = false }
bytes = { version = "1", optional = true }
http-body = { version = "1", optional = true }
http-body-util = { version = "0.1", optional = true }
tokio = { version = "1", optional = true, features = ["time"] }
uuid = { version = "1", optional = true, features = ["serde"] }
tracing = { version = "0.1", optional = true }
utoipa = { version = "5.4", optional = true, features = ["chrono", "uuid"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net"] }
axum = { version = "0.8", features = ["tokio", "http1"] }
tower = { version = "0.5", features = ["util"] }
